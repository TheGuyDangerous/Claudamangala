<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1230"/>
      <stop offset="45%" stop-color="#3b1f5c"/>
      <stop offset="100%" stop-color="#c96442"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- decorative key-badge icon, echoing the app's menu bar glyph -->
  <g transform="translate(120,120)" filter="url(#soft)">
    <circle cx="60" cy="60" r="60" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="60" cy="60" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M40 55 a20 20 0 1 1 20 20 a20 20 0 0 1 -14 -6 l-26 26 v10 h10 l4 -4 h8 v-8 l4 -4 l6 6 l8 -8 z"
          transform="translate(6,-10) scale(0.62)"
          fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <text x="280" y="165" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="700" fill="#ffffff">Claudamangala</text>
  <text x="284" y="210" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="400" fill="#f2e9ff" fill-opacity="0.85">Switch Claude Code accounts from your Mac's menu bar</text>

  <g transform="translate(284,250)" font-family="'SF Mono',Menlo,monospace" font-size="15" fill="#ffffff" fill-opacity="0.55">
    <text x="0" y="0">sign in · view accounts · rename · apply · quit</text>
  </g>
</svg>
